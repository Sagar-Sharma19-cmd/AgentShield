  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agentshield}
  #     SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agentshield_user}
  #     SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  #     RISK_ENGINE_URL: http://risk-engine:8000
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # ----------------------------------------------------------
  # Risk Engine — Python FastAPI
  # Uncomment when risk-engine/Dockerfile is ready
  # ----------------------------------------------------------
  # risk-engine:
  #   build:
  #     context: ./risk-engine
  #     dockerfile: Dockerfile
  #   container_name: agentshield-risk-engine
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"

  # ----------------------------------------------------------
  # Frontend — Next.js Dashboard
  # Uncomment when frontend/Dockerfile is ready
  # ----------------------------------------------------------
  # frontend:
  #   build:
