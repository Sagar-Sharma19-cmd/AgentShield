# ============================================================
# AgentShield — Docker Compose
#
# This file defines the local multi-service development
# environment. Services are added incrementally as each
# component is implemented.
#
# Current status:
#   - postgres   : configured (ready to use)
#   - backend    : placeholder (not yet implemented)
#   - risk-engine: placeholder (not yet implemented)
#   - frontend   : placeholder (not yet implemented)
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL — primary database
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: agentshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentshield}
      POSTGRES_USER: ${POSTGRES_USER:-agentshield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentshield_user}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # ----------------------------------------------------------
  # Backend — Spring Boot Security Gateway
  # Uncomment when backend/Dockerfile is ready
  # ----------------------------------------------------------
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: agentshield-backend
