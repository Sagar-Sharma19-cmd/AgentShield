name: Risk Engine CI

on:
  push:
    branches: [ main ]
    paths:
      - 'risk-engine/**'
      - '.github/workflows/risk-engine-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'risk-engine/**'
      - '.github/workflows/risk-engine-ci.yml'

jobs:
  test:
    name: Risk Engine Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'risk-engine/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r risk-engine/requirements.txt pytest

      - name: Run pytest
        run: |
          cd risk-engine
          pytest test_main.py -v
