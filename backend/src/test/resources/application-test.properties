# Test application properties
# Uses H2 in-memory database so tests don't need a running PostgreSQL instance
spring.datasource.url=jdbc:h2:mem:agentshield_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Schema is created by Flyway migrations; Hibernate validates entities against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Test-only security values. NOT secrets — never reuse outside tests.
agentshield.security.api-key-pepper=test-only-pepper-not-a-secret-0123456789
agentshield.security.admin-api-key=test-only-admin-key-not-a-secret-0123456789
