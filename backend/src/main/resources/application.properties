# Application Properties — AgentShield Backend
# ============================================================
# Do NOT put real secrets here.
# Use environment variables or a .env file for sensitive values.
# ============================================================

spring.application.name=agentshield-backend
# Default 8081: port 8080 is often taken locally (e.g. Jenkins). Override with SERVER_PORT.
server.port=${SERVER_PORT:8081}

# --- Database ---
# Override these via environment variables or .env in production/Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/agentshield}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agentshield_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Database migrations (Flyway) ---
# Schema is owned by versioned scripts in src/main/resources/db/migration.
# One-time upgrade of a database created by the old ddl-auto=update setup:
#   SPRING_FLYWAY_BASELINE_ON_MIGRATE=true mvn spring-boot:run
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Column type for JSON columns (V13). H2 (tests) has no JSONB, so application-test.properties sets JSON.
spring.flyway.placeholders.json_type=jsonb

# --- JPA / Hibernate ---
# Hibernate only validates entity mappings against the Flyway-managed schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Actuator (health check) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Logging ---
logging.level.com.agentshield=DEBUG
logging.level.org.springframework.web=INFO

# --- Security ---
# Both values are REQUIRED (>= 32 characters) and must come from the environment.
# The application refuses to start without them. Generate with: openssl rand -base64 48
#   AGENTSHIELD_API_KEY_PEPPER : server-side secret used to HMAC agent API keys before storage
#   AGENTSHIELD_ADMIN_API_KEY  : key required in the X-Admin-API-Key header for admin APIs
agentshield.security.api-key-pepper=${AGENTSHIELD_API_KEY_PEPPER:}
agentshield.security.admin-api-key=${AGENTSHIELD_ADMIN_API_KEY:}
# AGENTSHIELD_DECISION_TOKEN_SECRET : HMAC key for the one-time decision tokens (HS256) returned on ALLOW and on
#                                     a successful review claim. REQUIRED (>= 32 characters), like the two above.
#                                     Rotating it invalidates every outstanding (unredeemed) token, nothing else.
agentshield.decision-token.secret=${AGENTSHIELD_DECISION_TOKEN_SECRET:}
# Seconds a decision token stays redeemable after it is issued. Default: 60.
agentshield.decision-token.ttl-seconds=${AGENTSHIELD_DECISION_TOKEN_TTL_SECONDS:60}
# API keys are the only authentication mechanism; disable Spring's generated default user.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- Risk Engine (external service) ---
# The Risk Engine is a risk SIGNAL only — see docs/architecture.md and docs/risk-engine.md.
# It is consulted only for requests already ALLOWed/REVIEWed by PolicyEngine, and can only
# escalate that decision, never grant or downgrade it. timeout-ms bounds both the connect
# and read phases of the call; on timeout, outage, HTTP error, or an unparsable response the
# gateway fails safe (HIGH/REVIEW territory), never open.
agentshield.risk-engine.url=${RISK_ENGINE_URL:http://localhost:8000}
agentshield.risk-engine.timeout-ms=${RISK_ENGINE_TIMEOUT_MS:300}

# --- Trajectory analysis (session-history escalation signal) ---
# Kill switch. When false, trajectory is not evaluated: audit trajectory fields stay NULL, and
# the decision is exactly the authorization, policy and Risk Engine result. Default: true.
agentshield.trajectory.enabled=${AGENTSHIELD_TRAJECTORY_ENABLED:true}

# --- Human review loop ---
# Minutes a review request stays open after the gateway creates it. After that it can no longer be
# started, approved, rejected or claimed by the agent, which must submit the request again. Default: 30.
agentshield.review.ttl-minutes=${AGENTSHIELD_REVIEW_TTL_MINUTES:30}

# --- Content inspection (Phase V13) ---
# Inspects the optional "arguments" of a gateway request (and its resource) before policy. A secret (AWS key,
# private key, GitHub/Slack/Stripe/Google key, JWT, password assignment) is DENY; PII (email, card number, PAN,
# Aadhaar, E.164 phone) and prompt injection (override phrases, hidden Unicode) go to REVIEW. Raw values are never
# stored, logged or returned: only redacted findings. Requests without arguments are not inspected. Default: true.
agentshield.inspection.enabled=${AGENTSHIELD_INSPECTION_ENABLED:true}
# Limits on "arguments" (canonical JSON size in bytes, nesting depth). Larger or deeper is a 400.
agentshield.inspection.max-argument-bytes=65536
agentshield.inspection.max-argument-depth=10
# Each detector can be switched off on its own, for example:
#   agentshield.inspection.email.enabled=false
# Names: aws-access-key, aws-secret-key, private-key, github-token, slack-token, stripe-key, google-api-key, jwt,
#        generic-secret, email, credit-card, pan, aadhaar, phone, prompt-injection, hidden-unicode.
